name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: 21
        distribution: temurin

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Restore release keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        test -n "$RELEASE_KEYSTORE_BASE64"
        umask 077
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

    - name: Check and build signed release APK
      env:
        ORG_GRADLE_PROJECT_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
        ORG_GRADLE_PROJECT_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        ORG_GRADLE_PROJECT_SIGNING_KEY_ALIAS: ttrss-release
        ORG_GRADLE_PROJECT_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      run: |
        test -n "$ORG_GRADLE_PROJECT_SIGNING_STORE_PASSWORD"
        ./gradlew --no-daemon check assembleSigned

    - name: Verify and name release APK
      run: |
        build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
        apk=org.fox.ttrss/build/outputs/apk/signed/org.fox.ttrss-signed.apk
        "$build_tools/apksigner" verify --verbose --print-certs "$apk"
        "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
        cat "$RUNNER_TEMP/apk-badging.txt"
        grep -q "package: name='org.fox.ttrss'" "$RUNNER_TEMP/apk-badging.txt"
        if grep -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
          echo 'Release APK must not be debuggable.'
          exit 1
        fi
        mv "$apk" "org.fox.ttrss/build/outputs/apk/signed/ttrss-release-${{ github.run_number }}-${{ github.sha }}.apk"

    - name: Upload release APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: org.fox.ttrss/build/outputs/apk/signed/ttrss-release-${{ github.run_number }}-${{ github.sha }}.apk
        archive: false
        if-no-files-found: error

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-build-reports-${{ github.run_number }}
        path: org.fox.ttrss/build/reports/
        if-no-files-found: ignore

    - name: Remove restored keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/release.keystore"
